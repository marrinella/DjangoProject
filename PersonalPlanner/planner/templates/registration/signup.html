{% extends "base.html" %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<div class="card">
  <h2>Реєстрація</h2>

  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}

    <button class="btn btn-primary" type="submit">Створити акаунт</button>
  </form>

  <p style="margin-top:12px;">
    Вже є акаунт? <a href="{% url 'login' %}">Увійти</a>
  </p>
</div>
{% endblock %}
